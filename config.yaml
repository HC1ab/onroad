# 분석 설정 한 파일. 값을 바꾸고 파이프라인을 재실행하면 전체가 재현된다.
# 공유 파일: 수정은 단독 PR로 하고 팀에 공지한다.
entry_seconds: 7
speeds_mps: [1.0, 0.8, 0.7]
min_sample: 5
outlier:
  max_length_m: 80
  max_green_s: 200
exposure_radius_m: 300
exposure_radius_sensitivity_m: [200, 500]
crs_storage: "EPSG:4326"
crs_compute: "EPSG:5179"
# 경로당 밀집 플래그: 반경 안 경로당 수가 부산 횡단보도 분포의 이 분위수 이상이면 true
senior_center_density_quantile: 0.75
# 사고다발지역(R4)은 후보 선정에 쓰지 않고 검증(V3)에만 쓴다. 이 연도 범위(포함)의 다발지역 전체를 쓴다
crash_validation_years: [2021, 2025]

# ---------- v2 추천 보행시간 (결정 009) ----------
# 필요 시간 = max(기록 보행시간, entry_seconds + L / v). v 는 아래 3단계로 정한다
target_coverage: 0.85                    # 기본 목표: 이용자의 85%가 시간 안에 건넘 (15퍼센타일 설계 관례)
target_coverage_sensitivity: [0.90, 0.95]
speed_bounds_mps: [0.7, 1.0]             # 적용 속도는 공식 기준 범위 안으로 자른다
formula_tolerance_s: 0.5                 # 기록 보행시간이 기준식과 "같다"고 보는 허용오차(기준식 분류, V7)
# 보행속도 분포: 한음 외(2020) 초록의 평균·15퍼센타일, 정규분포 근사(가정)
walking_speed_mps:
  general: {mean: 1.29, p15: 1.01}
  elderly: {mean: 1.13, p15: 0.85}
walking_speed_elderly_p15_sensitivity: [0.76]  # 여수 2016 실측. 결과 민감도 표시용
tier1_speed_mps: 0.7                     # 1단계: 노인보호구역(O1 코드 1·01) 반경 안
big_market_min_stores: 200               # 2단계: 대형 전통시장 점포 수 기준 (V6 민감도: 100·150·300)
market_exclude_keywords: ["산업용재", "공구", "전자", "기계", "자동차"]  # 고령자 목적지로 보기 어려운 상가
market_elderly_uplift: 0.137             # 2단계: 이용자 고령 비율 = 주민 고령 비율 + 이 값 (V6: 10.95%p / 0.80)
market_elderly_uplift_range: [0.063, 0.157]  # V6 역 하나씩·수안·부전 빼기 범위. 화면 민감도 표시용
add_seconds_threshold: 2                 # n_add2: 이 초 이상 추가되는 횡단보도 수 (툴팁·상세용)
area_metric: mean_add_s                  # 읍면동 채색·사분면 가로축: 평균 추가 초 (009 검수 보완)
coverage_basis: elderly                  # 화면 커버리지는 고령 보행자 기준. 이용자 구성은 속도 v 계산에만
child_zone_radius_m: 150                 # V7 비교: 어린이보호구역 시설 반경
# V6 지하철 무임 비율 검증
metro_year: "2024"
metro_radius_m: 500
permutations: 5000
seed: 20261101
