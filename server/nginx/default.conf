server {
    listen 80;
    server_name _;

    server_tokens off;
    gzip on;
    gzip_types application/json application/geo+json application/javascript text/css image/svg+xml;
    gzip_min_length 1024;

    root /usr/share/nginx/html;
    index index.html;

    # API (읽기 전용)
    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /healthz {
        proxy_pass http://api:8000/healthz;
    }

    # 경계 등 정적 데이터는 오래 캐시한다
    location /data/ {
        add_header Cache-Control "public, max-age=86400";
        try_files $uri =404;
    }

    # 프론트(SPA). 빌드(web/dist)가 아직 없으면 안내 페이지를 보여준다.
    location / {
        try_files $uri /index.html @placeholder;
    }

    location @placeholder {
        root /usr/share/nginx/placeholder;
        try_files /index.html =404;
    }
}
